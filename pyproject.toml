[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "production-mlops-ticket-router"
version = "0.1.0"
description = "A production-style, local-first MLOps system for customer-support ticket routing."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "License selection pending" }
authors = [
  { name = "Vijay Pratap Singh" },
]
dependencies = [
  "pydantic-settings",
  "pyyaml",
  "structlog",
]

[dependency-groups]
runtime = [
  "alembic",
  "datasets",
  "fastapi",
  "huggingface-hub",
  "mlflow",
  "pandas",
  "pandera[pandas]",
  "polars",
  "psycopg[binary]",
  "scikit-learn",
  "sqlalchemy",
  "uvicorn[standard]",
]
development = [
  "mypy",
  "pre-commit",
  "pytest",
  "pytest-cov",
  "ruff",
  "types-pyyaml",
]
monitoring = [
  "evidently",
]
orchestration = [
  "prefect",
]
dashboard = [
  "streamlit",
]

[tool.uv]
default-groups = ["runtime", "development"]

[tool.hatch.build.targets.wheel]
packages = ["src/ticket_router"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]
extend-exclude = [
  ".pytest-tmp",
  ".test-output",
  ".test-output-cache",
  "artifacts",
  "data",
  "work",
]

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "PT", "RUF", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "scripts"]
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
cache_dir = ".test-output-cache"
addopts = [
  "--strict-config",
  "--strict-markers",
  "--basetemp=.test-output",
  "--cov=ticket_router",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-report=xml",
]
markers = [
  "integration: tests requiring local infrastructure",
  "e2e: end-to-end tests requiring the complete local stack",
]

[tool.coverage.run]
branch = true
source = ["ticket_router"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
